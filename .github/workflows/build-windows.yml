name: Build FF14 Srank Desktop for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout build recipe
        uses: actions/checkout@v4

      - name: Verify source archive exists
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE 'FF14_Srank_Desktop_v4.0.0_工程源码.zip'
          if (-not (Test-Path -LiteralPath $archive)) {
            throw "找不到源码包：$archive。请先上传 FF14_Srank_Desktop_v4.0.0_工程源码.zip。"
          }

      - name: Extract source archive
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'ff14-srank-source'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Expand-Archive -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'FF14_Srank_Desktop_v4.0.0_工程源码.zip') -DestinationPath $destination -Force
          $project = Join-Path $destination 'FF14_Srank_Desktop_v4.0.0'
          if (-not (Test-Path -LiteralPath (Join-Path $project 'package.json'))) {
            throw '源码包目录结构不正确，未找到 package.json。'
          }
          "FF14_PROJECT=$project" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install build dependencies
        shell: pwsh
        working-directory: ${{ runner.temp }}/ff14-srank-source/FF14_Srank_Desktop_v4.0.0
        run: npm install --no-audit --no-fund

      - name: Check source syntax
        shell: pwsh
        working-directory: ${{ runner.temp }}/ff14-srank-source/FF14_Srank_Desktop_v4.0.0
        run: npm run check

      - name: Run automated tests
        shell: pwsh
        working-directory: ${{ runner.temp }}/ff14-srank-source/FF14_Srank_Desktop_v4.0.0
        run: npm test

      - name: Build Windows installer and portable EXE
        shell: pwsh
        working-directory: ${{ runner.temp }}/ff14-srank-source/FF14_Srank_Desktop_v4.0.0
        run: npm run dist:win

      - name: Upload Windows EXE files
        uses: actions/upload-artifact@v4
        with:
          name: FF14-Srank-Desktop-v4.0.0-Windows-EXE
          path: ${{ runner.temp }}/ff14-srank-source/FF14_Srank_Desktop_v4.0.0/release/*.exe
          if-no-files-found: error
          retention-days: 14
