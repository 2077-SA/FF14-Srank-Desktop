name: Build and publish FF14 Srank Desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (without v, for example 4.1.1)'
        required: true
        default: '4.1.1'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, test and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract desktop project archive
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE 'FF14_Srank_Desktop_v4.1.1_工程源码.zip'
          if (-not (Test-Path -LiteralPath $archive)) { throw '未找到 FF14_Srank_Desktop_v4.1.1_工程源码.zip' }
          $dest = Join-Path $env:RUNNER_TEMP 'ff14-srank-v411'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $dest -Force
          $project = Join-Path $dest 'FF14_Srank_Desktop_v4.1.1'
          if (-not (Test-Path (Join-Path $project 'package.json'))) { throw '工程 ZIP 目录结构不正确' }
          "FF14_PROJECT=$project" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install dependencies
        shell: pwsh
        working-directory: ${{ runner.temp }}/ff14-srank-v411/FF14_Srank_Desktop_v4.1.1
        run: npm install --no-audit --no-fund

      - name: Check source syntax
        shell: pwsh
        working-directory: ${{ runner.temp }}/ff14-srank-v411/FF14_Srank_Desktop_v4.1.1
        run: npm run check

      - name: Run automated tests
        shell: pwsh
        working-directory: ${{ runner.temp }}/ff14-srank-v411/FF14_Srank_Desktop_v4.1.1
        run: npm test

      - name: Build Windows installer and portable EXE
        shell: pwsh
        working-directory: ${{ runner.temp }}/ff14-srank-v411/FF14_Srank_Desktop_v4.1.1
        run: npm run dist:win -- --publish never

      - name: Publish GitHub Release and updater metadata
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.1.1
          target_commitish: ${{ github.sha }}
          name: FF14 Srank Desktop v4.1.1
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/ff14-srank-v411/FF14_Srank_Desktop_v4.1.1/release/*.exe
            ${{ runner.temp }}/ff14-srank-v411/FF14_Srank_Desktop_v4.1.1/release/*.yml
            ${{ runner.temp }}/ff14-srank-v411/FF14_Srank_Desktop_v4.1.1/release/*.blockmap

      - name: Keep build artifacts for manual download
        uses: actions/upload-artifact@v4
        with:
          name: FF14-Srank-Desktop-v4.1.1-Windows-EXE
          path: ${{ runner.temp }}/ff14-srank-v411/FF14_Srank_Desktop_v4.1.1/release/*
          if-no-files-found: error
          retention-days: 14
